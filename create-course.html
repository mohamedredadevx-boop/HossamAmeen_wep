<!doctype html><html lang="ar" dir="rtl"><head><meta name="description" content="أدوات داخلية لإدارة الكورسات."><meta property="og:title" content="إنشاء أو تعديل كورس | مستر حسام أمين"><meta property="og:description" content="أدوات داخلية لإدارة الكورسات."><meta property="og:type" content="noindex"><meta property="og:locale" content="ar_EG"><meta name="robots" content="noindex, nofollow"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إنشاء أو تعديل كورس | مستر حسام أمين</title><link rel="stylesheet" href="assets/bootstrap.min.css"><link rel="icon" type="image/jpeg" href="assets/platform-logo.jpeg"><link rel="stylesheet" href="assets/style.css"></head><body><header class="topbar container"><meta name="description" content="أدوات داخلية لإدارة الكورسات."><meta property="og:title" content="إنشاء أو تعديل كورس | مستر حسام أمين"><meta property="og:description" content="أدوات داخلية لإدارة الكورسات."><meta property="og:type" content="noindex"><meta property="og:locale" content="ar_EG"><meta name="robots" content="noindex, nofollow"><div class="nav"><a class="brand" href="index.html"><img class="brand-logo" src="assets/platform-logo.jpeg" alt="شعار منصة مستر حسام أمين"><span>مستر حسام أمين<small>بوابتك للتفوق</small></span></a><button class="menu-toggle" aria-label="فتح القائمة" aria-expanded="false">☰</button><nav class="nav-links"><a href="teacher-dashboard.html">لوحة المدرس</a><a href="courses.html">الكورسات</a></nav><div class="nav-actions"><a class="btn btn-primary" href="profile.html">ملفي</a></div></div></header><main class="container"><section class="page-heading"><div class="breadcrumbs"><a href="teacher-dashboard.html">لوحة المدرس</a> / الكورسات</div><h1 id="courseFormHeading">إنشاء كورس جديد</h1><p class="lead">أنشئ الكورس ثم أضف محاضرات الفيديو وملفات PDF والامتحانات.</p></section><section class="form-wrap"><form class="form-card" id="courseForm"><div class="notice"></div><label class="field"><span>اسم الكورس</span><input required name="title"></label><label class="field"><span>وصف الكورس</span><textarea required rows="4" name="description"></textarea></label><label class="field"><span>الصف الدراسي</span><select required name="grade"><option value="first-secondary">الأول الثانوي</option><option value="second-secondary">الثاني الثانوي</option><option value="third-secondary">الثالث الثانوي</option></select></label><label class="field"><span>نوع الكورس</span><select name="isFree"><option value="true">مجاني</option><option value="false">مدفوع</option></select></label><label class="field"><span>السعر بالجنيه المصري</span><input id="coursePriceInput" name="price" type="number" min="0.01" max="99999.99" step="0.01" value="0" disabled></label><label class="field"><span>الموافقة على طلبات الالتحاق</span><select name="requiresApproval"><option value="true">موافقة يدوية من المدرس أو المدير</option><option value="false">موافقة تلقائية</option></select></label><label class="field"><span>حالة الكورس</span><select name="published"><option value="true">منشور</option><option value="false">مسودة</option></select></label><label class="field"><span>صورة غلاف الكورس (اختياري)</span><input id="courseCoverFile" name="coverImage" type="file" accept="image/png,image/jpeg,image/webp"><small>الصيغ المسموحة JPG أو PNG أو WebP، حتى 8 ميغابايت.</small><img id="courseCoverPreview" alt="معاينة غلاف الكورس" hidden style="max-width:220px;max-height:140px;object-fit:cover;border-radius:12px;margin-top:12px"></label><button class="btn btn-primary" type="submit">حفظ الكورس</button></form></section><section class="section"><div class="section-head"><h2>كورساتي</h2></div><div id="managedCourses" class="course-grid"></div></section></main><script src="assets/app.js"></script></body></html>
